{% extends 'catalog/base.html' %}

{% block title %}Добавить товар - Skystore{% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Добавление нового товара</h1>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
        <div class="card mb-4 box-shadow">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-lg btn-block btn-outline-success">Сохранить товар</button>
                    <a href="{% url 'catalog:home' %}" class="btn btn-lg btn-block btn-outline-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
