{% extends 'catalog/base.html' %}

{% block title %}Удаление товара - Skystore{% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Удаление товара</h1>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
        <div class="card mb-4 box-shadow">
            <div class="card-body text-center">
                <h4>Вы уверены, что хотите удалить товар «{{ product.name }}»?</h4>
                <p class="text-muted">Это действие нельзя отменить.</p>
                
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-lg btn-danger me-2">Да, удалить</button>
                    <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-lg btn-outline-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
